<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liue</title>

<!-- 提前读取主题，避免刷新时首屏闪烁 -->
<script>
  (function () {
    try {
      if (localStorage.getItem('liue-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>

<style>
  /* ================= 配色变量 ================= */
  :root{
    --bg:            #ffffff;
    --surface:       #ffffff;
    --text:          #1a1a1a;
    --muted:         #9a9a9a;
    --line:          #e8e8e8;
    --line-strong:   #d4d4d4;
    --hover:         #f7f7f7;
    --shadow:        0 2px 8px rgba(0, 0, 0, .06);
    --shadow-hover:  0 12px 28px rgba(0, 0, 0, .11);
    --toggle-shadow: 0 3px 10px rgba(0, 0, 0, .07);
  }

  [data-theme="dark"]{
    --bg:            #0f0f10;
    --surface:       #18181a;
    --text:          #f2f2f3;
    --muted:         #7c7c82;
    --line:          #2a2a2e;
    --line-strong:   #3d3d44;
    --hover:         #202024;
    --shadow:        0 2px 8px rgba(0, 0, 0, .45);
    --shadow-hover:  0 12px 28px rgba(0, 0, 0, .65);
    --toggle-shadow: 0 3px 10px rgba(0, 0, 0, .55);
  }

  /* ================= 基础 ================= */
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{ min-height: 100%; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 96px 24px 64px;
    transition: background .35s ease, color .35s ease;
  }

  /* ================= 主题切换按钮 ================= */
  .theme-toggle{
    position: fixed;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--toggle-shadow);
    z-index: 20;
    transition: background .3s ease, border-color .3s ease, color .3s ease,
                box-shadow .25s ease, transform .25s cubic-bezier(.22,.61,.36,1);
  }

  .theme-toggle:hover{
    transform: translateY(-2px) rotate(-10deg);
    box-shadow: var(--shadow-hover);
    border-color: var(--line-strong);
  }

  .theme-toggle:active{ transform: translateY(0) scale(.94); }

  .theme-toggle:focus-visible{
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  .theme-toggle svg{ display: block; }

  .icon-sun{ display: none; }
  [data-theme="dark"] .icon-sun{ display: block; }
  [data-theme="dark"] .icon-moon{ display: none; }

  /* ================= 头部 ================= */
  header{
    text-align: center;
    margin-bottom: 72px;
    animation: rise .7s cubic-bezier(.22,.61,.36,1) backwards;
  }

  .logo{
    font-size: 40px;
    font-weight: 600;
    letter-spacing: .14em;
    line-height: 1.1;
  }

  .tagline{
    margin-top: 14px;
    font-size: 13px;
    letter-spacing: .18em;
    color: var(--muted);
    text-transform: uppercase;
    transition: color .35s ease;
  }

  .divider{
    width: 36px;
    height: 1px;
    background: var(--line);
    margin: 28px auto 0;
    transition: background .35s ease;
  }

  /* ================= 三列链接区 ================= */
  main{ width: 100%; max-width: 880px; }

  .links{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .link-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    height: 58px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .04em;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: var(--shadow);
    transition: background .25s ease, border-color .25s ease, color .35s ease,
                box-shadow .25s ease, transform .25s cubic-bezier(.22,.61,.36,1);
    /* 入场动画（结束时不保留 transform，避免影响 hover） */
    animation: rise .6s cubic-bezier(.22,.61,.36,1) backwards;
  }

  /* 逐个错开���入场延迟 */
  .links .link-btn:nth-child(1){ animation-delay: .06s; }
  .links .link-btn:nth-child(2){ animation-delay: .11s; }
  .links .link-btn:nth-child(3){ animation-delay: .16s; }
  .links .link-btn:nth-child(4){ animation-delay: .21s; }
  .links .link-btn:nth-child(5){ animation-delay: .26s; }
  .links .link-btn:nth-child(6){ animation-delay: .31s; }
  .links .link-btn:nth-child(7){ animation-delay: .36s; }
  .links .link-btn:nth-child(8){ animation-delay: .41s; }
  .links .link-btn:nth-child(9){ animation-delay: .46s; }

  .link-btn:hover{
    background: var(--hover);
    border-color: var(--line-strong);
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
  }

  .link-btn:active{
    transform: translateY(-1px) scale(.985);
    box-shadow: var(--shadow);
  }

  .link-btn:focus-visible{
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  /* ================= 页脚 ================= */
  footer{
    margin-top: auto;
    padding-top: 80px;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--muted);
    transition: color .35s ease;
  }

  /* ================= 动画关键帧 ================= */
  @keyframes rise{
    from{ opacity: 0; transform: translateY(16px); }
    to  { opacity: 1; transform: translateY(0);    }
  }

  /* 尊重系统「减少动态效果」设置 */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  /* ================= 响应式 ================= */
  @media (max-width: 680px){
    body{ padding: 72px 18px 40px; }
    .theme-toggle{ top: 16px; right: 16px; width: 40px; height: 40px; }
    .logo{ font-size: 30px; }
    header{ margin-bottom: 48px; }
    .links{
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .link-btn{ height: 54px; font-size: 14px; }
  }

  @media (max-width: 400px){
    .links{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- 主题切换 -->
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色主题">
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
    </svg>
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M19.07 4.93l-1.41 1.41M6.34 17.66l-1.41 1.41"/>
    </svg>
  </button>

  <header>
    <h1 class="logo">Liue</h1>
    <p class="tagline">Personal&nbsp;Blog</p>
    <div class="divider"></div>
  </header>

  <main>
    <nav class="links" aria-label="站点��航">

      <!-- 第 1 行 -->
      <a class="link-btn" href="/gametools/langrensha-demo0.3.2.html">狼人杀记录板测试</a>
      <a class="link-btn" href="/gametools/dice.html">多面骰子</a>
      <a class="link-btn" href="/gametools/pointrecodedemo1.html">计分板</a>

      <!-- 第 2 行 -->
      <a class="link-btn" href="/games/chinesechess.html">中国象棋</a>
	  <a class="link-btn" href="/games/internationalchess.html">国际象棋</a>
      <a class="link-btn" href="games/2048.html">合成2048</a>
      <a class="link-btn" href="#">滚木</a>

      <!-- 第 3 行 -->
      <a class="link-btn" href="#">Git滚木</a>
      <a class="link-btn" href="#">Bil滚木</a>
      <a class="link-btn" href="#">QQ滚木</a>

    </nav>
  </main>

  <footer>© 2023-2026 Liue</footer>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById('themeToggle');

      function setTheme(theme) {
        if (theme === 'dark') {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.setAttribute('data-theme', 'light');
        }
        try {
          localStorage.setItem('liue-theme', theme);
        } catch (e) {}
      }

      toggle.addEventListener('click', function () {
        var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        setTheme(current === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>

</body>
</html>
